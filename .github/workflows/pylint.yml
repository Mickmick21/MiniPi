name: Pylint

on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - uses: actions/checkout@v6

      - name: Configurer ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Dépendences
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Lint
        run: |
          pylint $(git ls-files '*.py')
